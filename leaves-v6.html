<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل إجازات الموظفين</title>
<style>
:root{--bg:#f7f4ec;--card:#fff;--ink:#3a2f22;--mute:#8a7a62;--line:#e8dfc8;--gold:#cfae4c;--goldd:#b38a2e;--green:#43966b;--chip:#f1f2f5;--chipink:#4a5060;--red:#c8593f;--blue:#3f74b8;--in:#fcfbf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1913;--card:#27231b;--ink:#f1e8d6;--mute:#b3a488;--line:#3d3729;--chip:#38342b;--chipink:#d8d0bd;--in:#211e17}}
:root[data-theme="dark"]{--bg:#1c1913;--card:#27231b;--ink:#f1e8d6;--mute:#b3a488;--line:#3d3729;--chip:#38342b;--chipink:#d8d0bd;--in:#211e17}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",Tahoma,sans-serif;min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.logo{width:64px;height:64px;margin:0 auto 12px;border:2px solid var(--gold);border-radius:20px;background:var(--in);display:grid;place-items:center;color:var(--goldd)}
h1{font-size:28px;font-weight:800;text-align:center;margin:0}
.sub{text-align:center;color:var(--mute);margin:4px 0 20px;font-size:15px}
.tabs{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--line) 55%,var(--bg));margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;border-radius:15px;padding:12px 4px;font:700 16px -apple-system,"SF Arabic","Geeza Pro",sans-serif;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--gold);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:700;font-size:14px;color:var(--mute);margin-bottom:8px}
input,textarea,select{width:100%;font:500 16px -apple-system,"SF Arabic","Geeza Pro",sans-serif;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
input[type=date],input[type=month]{text-align:center;font-weight:700}
textarea{min-height:110px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.num{width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;font-weight:800;color:var(--goldd);background:var(--in)}
.name{flex:1;font-weight:700;font-size:17px;line-height:1.45}
.chips{display:flex;gap:6px;margin:12px 0 10px}
.chip{flex:1;border:0;border-radius:12px;padding:10px 4px;background:var(--chip);color:var(--chipink);font:700 15px -apple-system,"SF Arabic","Geeza Pro",sans-serif;cursor:pointer}
.chip.p.on{background:var(--green);color:#fff}
.chip.l.on{background:var(--red);color:#fff}
.chip.t.on{background:var(--blue);color:#fff}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-weight:700;font-size:14px}
.b{padding:5px 12px;border-radius:99px;background:var(--chip);color:var(--chipink)}
.b.l{background:var(--red);color:#fff}.b.t{background:var(--blue);color:#fff}.b.p{background:var(--green);color:#fff}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--gold);color:#fff;font:700 16px -apple-system,"SF Arabic","Geeza Pro",sans-serif;cursor:pointer}
.btn.g{background:var(--chip);color:var(--chipink)}
.btn.x{background:none;color:var(--red);padding:6px 10px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.dates{color:var(--mute);font-size:14px;margin-top:8px;line-height:1.7}
#lock{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;align-items:center;justify-content:center;padding:24px}
#lock .card{width:100%;max-width:340px;text-align:center}
.err{color:var(--red);font-weight:700;min-height:22px;margin:8px 0}
.al{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"rlig" 0,"calt" 0}
</style>
</head>
<body>
<div id="lock">
  <div class="card">
    <div class="logo">🔒</div>
    <h1 style="font-size:22px">أدخل رمز الدخول</h1>
    <p class="sub" style="margin-bottom:14px">الصفحة محمية</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز" style="text-align:center;letter-spacing:6px">
    <div class="err" id="perr"></div>
    <button class="btn" id="enter" style="width:100%">دخول</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v2h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3zm3 6a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm-4.5 9h9c0-2-2.7-3-4.5-3s-4.5 1-4.5 3z"/></svg></div>
  <h1>سجل إجازات الموظفين</h1>
  <p class="sub" id="cnt"></p>
  <div class="tabs" role="tablist">
    <button data-t="today" class="on">اليوم</button>
    <button data-t="rep">التقارير</button>
    <button data-t="emp">الموظفون</button>
  </div>

  <section id="today">
    <div class="card"><label for="d">تاريخ التسجيل:</label><input id="d" type="date"></div>
    <div class="card" style="padding:6px 12px"><input id="q" type="search" placeholder="بحث عن اسم أو رتبة..." style="border:0;background:none"></div>
    <div class="sum" id="sum"></div>
    <div id="list"></div>
  </section>

  <section id="rep" hidden>
    <div class="card"><label for="m">الشهر:</label><input id="m" type="month"></div>
    <div class="card" style="padding:6px 12px"><input id="rq" type="search" placeholder="بحث عن اسم أو رتبة..." style="border:0;background:none"></div>
    <div class="sum" id="rsum"></div>
    <div id="rlist"></div>
    <button class="btn g" id="csv" style="width:100%;margin-top:6px" hidden>حفظ التقرير (CSV)</button>
  </section>

  <section id="emp" hidden>
    <div class="card">
      <label for="add">إضافة موظفين (اسم بكل سطر):</label>
      <textarea id="add" placeholder="العميد ... &#10;العقيد ..."></textarea>
      <button class="btn" id="addb" style="margin-top:10px;width:100%">إضافة</button>
    </div>
    <div class="card">
      <label for="np">تغيير رمز الدخول:</label>
      <input id="np" type="password" inputmode="numeric" placeholder="الرمز الجديد">
      <button class="btn g" id="npb" style="margin-top:10px;width:100%">حفظ الرمز</button>
      <div class="err" id="nperr" style="color:var(--green)"></div>
    </div>
    <div class="card">
      <label>نسخ احتياطي واستعادة:</label>
      <div class="row" style="gap:8px;margin-bottom:10px"><button class="btn" id="bk" style="flex:1">حفظ ملف</button><button class="btn g" id="bc" style="flex:1">نسخ النص</button></div>
      <textarea id="rs" placeholder="للاستعادة: الصق نص النسخة هنا أو اختر ملف" style="min-height:80px"></textarea>
      <input id="rf" type="file" accept=".json,.txt,application/json,text/plain" style="margin-top:8px">
      <button class="btn g" id="rb" style="margin-top:10px;width:100%">استعادة النسخة</button>
      <div class="err" id="rerr" style="color:var(--green)"></div>
    </div>
    <div class="card"><label>فحص الأسماء:</label><button class="btn g" id="chk" style="width:100%">فحص الحروف</button><div class="dates" id="chkr" style="direction:ltr;text-align:left;margin-top:8px"></div></div>
    <div id="elist"></div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SEED=[];
let emps=LS.get('emps2',SEED);
let recs=LS.get('recs',{});
const save=()=>{LS.set('emps2',emps);LS.set('recs',recs)};
const clean=s=>String(s).normalize('NFKC').replace(/\p{Cf}/gu,'').replace(/\s+/g,' ').trim();
emps=emps.map(e=>({id:e.id,name:clean(e.name)}));save();
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=s=>esc(s).replace(/الله/g,'<span class="al">ال\u0640له</span>');

/* passcode (screen lock only, stored in this browser) */
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return s}}
const unlocked=()=>{try{return sessionStorage.getItem('ok')==='1'}catch(e){return false}};
function open(){$('#lock').style.display='none';$('#app').hidden=false;init()}
async function tryPin(){
  const stored=LS.get('code2',null)||await hash('1998');
  if(await hash($('#pin').value)===stored){try{sessionStorage.setItem('ok','1')}catch(e){}open()}
  else{$('#perr').textContent='الرمز غير صحيح';$('#pin').value=''}
}
$('#enter').onclick=tryPin;
$('#pin').onkeydown=e=>{if(e.key==='Enter')tryPin()};
if(unlocked())open();else{$('#lock').style.display='flex'}

/* today */
function nz(s){return clean(s).replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')}

function renderToday(){
  const d=$('#d').value,day=recs[d]||{},q=nz($('#q').value);
  let l=0,t=0;
  emps.forEach(e=>{const s=(day[e.id]||{}).s;if(s==='l')l++;if(s==='t')t++});
  $('#sum').innerHTML=`<span class="b p">حاضر ${emps.length-l-t}</span><span class="b l">إجازة ${l}</span><span class="b t">زمنية ${t}</span>`;
  const rows=emps.map((e,i)=>({e,i})).filter(x=>!q||q.split(' ').every(w=>nz(x.e.name).includes(w)));
  $('#list').innerHTML=rows.length?rows.map(({e,i})=>{
    const r=day[e.id]||{},s=r.s||'p';
    return `<div class="card" data-id="${e.id}"><div class="row"><div class="num">${i+1}</div><div class="name">${nm(e.name)}</div></div>
    <div class="chips"><button class="chip p ${s==='p'?'on':''}" data-s="p">حاضر</button><button class="chip l ${s==='l'?'on':''}" data-s="l">إجازة</button><button class="chip t ${s==='t'?'on':''}" data-s="t">زمنية</button></div>
    <input class="note" placeholder="ملاحظة أو سبب..." value="${esc(r.n||'')}"></div>`}).join(''):'<div class="empty">لا توجد نتائج</div>';
}
function setRec(id,patch){
  const d=$('#d').value;recs[d]=recs[d]||{};
  const r=Object.assign({s:'p',n:''},recs[d][id],patch);
  if(r.s==='p'&&!r.n)delete recs[d][id];else recs[d][id]=r;
  if(!Object.keys(recs[d]).length)delete recs[d];
  save();
}
$('#list').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  setRec(c.closest('.card').dataset.id,{s:c.dataset.s});renderToday();
});
$('#list').addEventListener('input',e=>{
  if(!e.target.classList.contains('note'))return;
  setRec(e.target.closest('.card').dataset.id,{n:e.target.value});
});

/* reports */
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const p2=n=>String(n).padStart(2,'0');
const fmtD=(m,n)=>{const [y,mo]=m.split('-').map(Number);return WD[new Date(y,mo-1,n).getDay()]+' '+y+'/'+p2(mo)+'/'+p2(n)};
let lastCsv='';
function renderRep(){
  const m=$('#m').value,all=[];
  emps.forEach(e=>{
    const L=[],T=[];
    Object.keys(recs).filter(d=>d.startsWith(m)).sort().forEach(d=>{
      const r=recs[d][e.id];if(!r)return;
      const n=+d.slice(8);if(r.s==='l')L.push(n);if(r.s==='t')T.push(n);
    });
    if(L.length||T.length)all.push({e,L,T});
  });
  const q=nz($('#rq').value);
  const out=q?all.filter(x=>q.split(' ').every(w=>nz(x.e.name).includes(w))):all;
  const tl=out.reduce((a,x)=>a+x.L.length,0),tt=out.reduce((a,x)=>a+x.T.length,0);
  $('#rsum').innerHTML=`<span class="b l">إجازات ${tl} يوم</span><span class="b t">زمنية ${tt} مرة</span><span class="b">${out.length} موظف</span>`;
  $('#rlist').innerHTML=out.length?out.map(x=>{
    const items=[...x.L.map(n=>[n,'إجازة']),...x.T.map(n=>[n,'زمنية'])].sort((a,b)=>a[0]-b[0]);
    return `<div class="card"><div class="name">${nm(x.e.name)}</div>
    <div class="sum" style="margin:10px 0 0"><span class="b l">إجازة (اعتيادية): ${x.L.length} يوم</span><span class="b t">زمنية: ${x.T.length} مرة</span></div>
    <div class="dates">${items.map(([n,t])=>fmtD(m,n)+' · '+t).join('<br>')}</div></div>`}).join(''):`<div class="empty">${all.length?'لا توجد نتائج':'ماكو إجازات مسجلة بهذا الشهر'}</div>`;
  const ds=a=>a.map(n=>m.replace('-','/')+'/'+p2(n)).join(' ');
  lastCsv='\ufeffالاسم,إجازة اعتيادية (أيام),زمنية (مرات),تواريخ الاعتيادية,تواريخ الزمنية\n'+all.map(x=>[`"${x.e.name}"`,x.L.length,x.T.length,`"${ds(x.L)}"`,`"${ds(x.T)}"`].join(',')).join('\n');
  $('#csv').hidden=!all.length;
}
$('#csv').onclick=async()=>{
  try{const dl=await claude.use('downloads');if(dl)await dl.save({filename:'leave-report-'+$('#m').value+'.csv',data:lastCsv})}catch(e){}
};

/* employees */
function renderEmp(){
  $('#elist').innerHTML=emps.map((e,i)=>`<div class="card"><div class="row"><div class="num">${i+1}</div><div class="name">${nm(e.name)}</div><button class="btn x" data-del="${e.id}">حذف</button></div></div>`).join('')||'<div class="empty">أضف الموظفين من الأعلى</div>';
  $('#cnt').textContent=`متابعة دقيقة وحفظ تلقائي (${emps.length} موظف) · v6`;
}
$('#addb').onclick=()=>{
  const names=$('#add').value.split('\n').map(clean).filter(Boolean);
  let id=Math.max(0,...emps.map(e=>e.id));
  names.forEach(n=>emps.push({id:++id,name:n}));
  $('#add').value='';save();renderEmp();
};
$('#elist').addEventListener('click',e=>{
  const id=e.target.dataset.del;if(!id)return;
  const emp=emps.find(x=>x.id==id);
  if(emp&&confirm('حذف '+emp.name+' مع كل سجلاته؟')){
    emps=emps.filter(x=>x.id!=id);
    Object.values(recs).forEach(day=>delete day[id]);
    save();renderEmp();
  }
});
$('#npb').onclick=async()=>{
  const v=$('#np').value.trim();
  if(v.length<4){$('#nperr').style.color='var(--red)';$('#nperr').textContent='الرمز لازم 4 أرقام على الأقل';return}
  LS.set('code2',await hash(v));$('#np').value='';
  $('#nperr').style.color='var(--green)';$('#nperr').textContent='تم تغيير الرمز';
};

/* backup */
const bkText=()=>JSON.stringify({v:1,emps,recs});
const rmsg=(t,ok)=>{const e=$('#rerr');e.style.color=ok?'var(--green)':'var(--red)';e.textContent=t};
$('#bk').onclick=async()=>{
  try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:'leave-backup-'+today()+'.json',data:bkText()});rmsg('تم تجهيز الملف',true)}}catch(e){rmsg('تعذر حفظ الملف، استخدم نسخ النص',false)}
};
$('#bc').onclick=async()=>{
  $('#rs').value=bkText();
  try{await navigator.clipboard.writeText(bkText());rmsg('تم نسخ النص، الصقه بملاحظات أو رسالة لنفسك',true)}catch(e){rmsg('انسخ النص من الصندوق يدوياً',true)}
};
$('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rs').value=r.result;rmsg('تم تحميل الملف، اضغط استعادة',true)};r.readAsText(f)};
$('#rb').onclick=()=>{
  try{
    const d=JSON.parse($('#rs').value);
    if(!Array.isArray(d.emps)||typeof d.recs!=='object'||!d.emps.every(x=>x&&x.id&&x.name))throw 0;
    if(!confirm('سيتم استبدال البيانات الحالية بالنسخة. متأكد؟'))return;
    emps=d.emps.map(e=>({id:e.id,name:clean(e.name)}));recs=d.recs;save();renderEmp();renderToday();$('#rs').value='';rmsg('تمت الاستعادة',true);
  }catch(e){rmsg('النص غير صالح',false)}
};

$('#chk').onclick=()=>{const m={};emps.forEach(e=>[...e.name].forEach(c=>{const k=c.codePointAt(0);if(!(k===32||k===46||(k>=0x621&&k<=0x64A)))m[k]=(m[k]||0)+1}));const ks=Object.keys(m);$('#chkr').textContent=ks.length?ks.map(k=>'U+'+(+k).toString(16).toUpperCase().padStart(4,'0')+' x'+m[k]).join('  '):'OK: basic letters only'};
/* tabs + init */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['today','rep','emp'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t);
  if(b.dataset.t==='rep')renderRep();
});
function init(){
  $('#d').value=today();$('#m').value=today().slice(0,7);
  $('#d').onchange=renderToday;$('#q').oninput=renderToday;$('#m').onchange=renderRep;$('#rq').oninput=renderRep;
  renderToday();renderEmp();
}
</script>
</body>
</html>
